<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>API Contactos - Atención Total</title>
    <style>
        /* Importar una fuente moderna de Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { 
            width: 100%;
            max-width: 900px; 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); 
        }

        h1 { 
            color: #4a148c; 
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            border-bottom: 3px solid #7b1fa2; 
            padding-bottom: 15px; 
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        input { 
            width: 100%; 
            padding: 12px 15px; 
            margin-top: 8px; 
            border: 2px solid #e0e0e0; 
            border-radius: 8px; 
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #7b1fa2;
            outline: none;
            box-shadow: 0 0 8px rgba(123, 31, 162, 0.2);
        }

        button { 
            background-color: #7b1fa2; 
            color: white; 
            padding: 12px 25px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        button:hover { 
            background-color: #4a148c; 
            transform: translateY(-2px);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 40px; 
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        th, td { 
            padding: 15px; 
            text-align: left; 
            border-bottom: 1px solid #e0e0e0;
        }

        th { 
            background-color: #7b1fa2; 
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: #f3e5f5;
        }

        /* Botones de la tabla */
        .btn-edit { 
            background-color: #ffb300; 
            color: #333; 
            padding: 8px 12px;
            font-size: 13px;
            width: auto;
            margin-right: 5px; 
        }

        .btn-edit:hover {
            background-color: #ff8f00;
        }

        .btn-delete { 
            background-color: #e53935; 
            padding: 8px 12px;
            font-size: 13px;
            width: auto;
        }

        .btn-delete:hover {
            background-color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Directorio de Contactos</h1>
        
        <!-- Formulario de Creación -->
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" id="name" placeholder="Ej. John Doe">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" placeholder="Ej. john@finco.com">
        </div>
        <div class="form-group">
            <label>Teléfono:</label>
            <input type="text" id="phone" placeholder="Ej. 123456789">
        </div>
        <button onclick="guardarContacto()">Guardar Contacto</button>

        <!-- Tabla de Listado -->
        <table id="tablaContactos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/contacts';
        let editandoId = null;

        // Listar contactos (GET)
        async function cargarContactos() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.querySelector('#tablaContactos tbody');
            tbody.innerHTML = '';
            
            data.forEach(contacto => {
                tbody.innerHTML += `
                    <tr>
                        <td>${contacto.id}</td>
                        <td>${contacto.name}</td>
                        <td>${contacto.email}</td>
                        <td>${contacto.phone}</td>
                        <td>
                            <button class="btn-edit" onclick="editarContacto(${contacto.id}, '${contacto.name}', '${contacto.email}', '${contacto.phone}')">Editar</button>
                            <button class="btn-delete" onclick="eliminarContacto(${contacto.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Crear o Actualizar (POST / PUT)
        async function guardarContacto() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;

            if (!name || !email || !phone) return alert('Por favor, llene todos los campos.');

            const method = editandoId ? 'PUT' : 'POST';
            const url = editandoId ? `${API_URL}/${editandoId}` : API_URL;

            await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone })
            });

            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('phone').value = '';
            editandoId = null;
            cargarContactos();
        }

        function editarContacto(id, name, email, phone) {
            document.getElementById('name').value = name;
            document.getElementById('email').value = email;
            document.getElementById('phone').value = phone;
            editandoId = id;
        }

        async function eliminarContacto(id) {
            if (confirm('¿Estás seguro de eliminar este contacto?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                cargarContactos();
            }
        }

        // Cargar al iniciar la página
        cargarContactos();
    </script>
</body>
</html>
